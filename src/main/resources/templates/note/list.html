<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Список нотаток</title>
  <style>
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid black; padding: 10px; text-align: left; }
    .actions { display: flex; gap: 10px; }
  </style>
</head>
<body>

<h1>Мої нотатки</h1>

<div style="margin-bottom: 20px; padding: 10px; border: 1px dashed gray; width: max-content;">
  <h3>Створити нову нотатку</h3>
  <form th:action="@{/note/create}" method="post">
    <input type="text" name="title" placeholder="Назва нотатки" required />
    <input type="text" name="content" placeholder="Текст нотатки" required />
    <button type="submit">Додати</button>
  </form>
</div>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Назва</th>
    <th>Контент</th>
    <th>Дії</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="note : ${notes}">
    <td th:text="${note.id}">1</td>
    <td th:text="${note.title}">Тестова назва</td>
    <td th:text="${note.content}">Тестовий текст</td>
    <td class="actions">
      <a th:href="@{/note/edit(id=${note.id})}">
        <button>Редагувати</button>
      </a>

      <form th:action="@{/note/delete}" method="post">
        <input type="hidden" name="id" th:value="${note.id}" />
        <button type="submit">Видалити</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
